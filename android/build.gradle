// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }

        // @capacitor/filesystem (and any other Kotlin-based plugin) compiles its
        // Kotlin at the JDK's default target (21 here), while Java is pinned to 17
        // above - Gradle rejects the mismatch. Pin Kotlin to 17 too. Matched by
        // task class name so this stays valid for non-Kotlin modules and needs no
        // Kotlin plugin on the root buildscript classpath.
        project.tasks.configureEach { task ->
            if (task.class.name.contains('KotlinCompile')) {
                task.kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }

    tasks.withType(JavaCompile) {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }
}

