# Codemagic iOS build -> TestFlight. No secrets in this file.
# Needs (set up in Codemagic UI + Apple): Apple Developer account, App Store Connect API key
# integration named "wellmindly_asc", and an app record for bundle id com.wellmindly.app.
workflows:
  ios-testflight:
    name: Wellmindly iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: wellmindly_asc
    environment:
      node: 22
      xcode: 26.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wellmindly.app
      vars:
        XCODE_SCHEME: App
        XCODE_PROJECT: ios/App/App.xcodeproj
    scripts:
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Apply signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set build number
        # Codemagic's per-workflow counter (monotonic). VERSIONING_SYSTEM=apple-generic
        # is set in the pbxproj so agvtool works.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Unsigned simulator build: no Apple account needed. Proves the app compiles, the Capacitor
  # plugins link, and the app launches; saves simulator screenshots + the app log as artifacts.
  ios-simulator-check:
    name: iOS simulator check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build for simulator
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
      - name: Launch on simulator and screenshot
        script: |
          set -x
          mkdir -p shots
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone') and 'Pro Max' in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.wellmindly.app
          sleep 25
          xcrun simctl io "$DEVICE" screenshot shots/01-launch.png
          xcrun simctl openurl "$DEVICE" "capacitor://localhost/login" || true
          sleep 8
          xcrun simctl io "$DEVICE" screenshot shots/02-login.png
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact \
            --predicate 'process == "App"' > shots/app-log.txt || true
          grep -iE "error|fault|exception|crash" shots/app-log.txt | head -40 || true
    artifacts:
      - shots/*
